name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/release.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "Using configured GitHub Actions release keystore secret."
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$SECRET_STORE_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$SECRET_KEY_PASS" >> "$GITHUB_ENV"
          else
            echo " ANDROID_KEYSTORE_BASE64 secret not set; generating fallback V2 release keystore for CI..."
            FALLBACK_PASS="StudyLearningRelease2026"
            FALLBACK_ALIAS="study_release"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$FALLBACK_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$FALLBACK_PASS" \
              -keypass "$FALLBACK_PASS" \
              -dname "CN=BasicLearning, OU=Education, O=Study, L=Shanghai, ST=Shanghai, C=CN"
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$FALLBACK_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

      - name: Extract version metadata
        id: meta
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        working-directory: Learning
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|g' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PappVersionCode="${{ steps.meta.outputs.version_code }}" \
            -PappVersionName="${{ steps.meta.outputs.version_name }}"
          cp app/build/outputs/apk/release/app-release.apk \
            "../BasicLearning-${{ steps.meta.outputs.tag }}-release.apk"
          ls -lh "../BasicLearning-${{ steps.meta.outputs.tag }}-release.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "基础学习 ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            BasicLearning-${{ steps.meta.outputs.tag }}-release.apk
